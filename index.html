<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEN SHOP | Premium Marketplace</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --cen-gold: #ffcc00; --cen-bg: #0f0f0f; --card-bg: #1a1a1a; }
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--cen-bg); color: white; margin: 0; padding-bottom: 100px; }

        /* Navigation */
        nav { background: #000; padding: 15px; position: sticky; top: 0; z-index: 1000; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #333; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 800; color: var(--cen-gold); }
        
        .search-bar { width: 100%; position: relative; }
        .search-bar input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #222; color: white; outline: none; }

        /* Stats & Coupons */
        .stats-bar { display: flex; justify-content: space-around; background: #111; padding: 10px; font-size: 12px; color: #888; }
        .coupon-active { color: var(--cen-gold); font-weight: bold; }

        /* Product Grid */
        .shop-container { padding: 15px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { .shop-container { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }

        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; position: relative; transition: 0.3s; }
        .product-card:hover { border-color: var(--cen-gold); transform: translateY(-5px); }
        .product-img { width: 100%; height: 180px; object-fit: cover; background: #222; }
        .product-info { padding: 12px; }
        .category { font-size: 10px; color: var(--cen-gold); text-transform: uppercase; margin-bottom: 5px; }
        .p-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .p-price { font-size: 18px; font-weight: 800; color: #fff; }
        
        .buy-btn { width: 100%; background: var(--cen-gold); color: black; border: none; padding: 10px; border-radius: 6px; font-weight: 700; margin-top: 10px; cursor: pointer; }
        .delete-p { position: absolute; top: 8px; right: 8px; background: rgba(255,0,0,0.7); border: none; color: white; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 12px; }

        /* Management Panel (Collapsible) */
        .admin-btn { padding: 15px; background: #111; border: 1px dashed #444; margin: 15px; border-radius: 8px; cursor: pointer; text-align: center; }
        #admin-panel { display: none; padding: 15px; background: #1a1a1a; margin: 0 15px; border-radius: 8px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .input-row input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #000; color: white; min-width: 140px; }

        /* Bottom Cart */
        .checkout-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: var(--cen-gold); color: black; padding: 15px; border-radius: 50px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); cursor: pointer; z-index: 2000; }
    </style>
</head>
<body>

<nav>
    <div class="nav-top">
        <div class="logo">CEN SHOP</div>
        <div id="user-bal" style="color:var(--cen-gold); font-weight: 800;">₹0.00</div>
    </div>
    <div class="search-bar">
        <input type="text" id="search" placeholder="Search products, brands and more..." onkeyup="searchProducts()">
    </div>
</nav>

<div class="stats-bar">
    <span>Free Delivery on all orders</span>
    <span id="coupon-status">Checking Coupons...</span>
</div>

<div class="admin-btn" onclick="toggleAdmin()">+ Add New Product to Marketplace</div>
<div id="admin-panel">
    <div class="input-row">
        <input type="text" id="p-name" placeholder="Product Name">
        <input type="number" id="p-price" placeholder="Price">
    </div>
    <div class="input-row">
        <input type="text" id="p-cat" placeholder="Category (e.g. Tech)">
        <input type="text" id="p-img" placeholder="Image Link">
        <button onclick="addProduct()" style="background:var(--cen-gold); padding: 10px 20px; border-radius: 5px; border:none; font-weight:bold;">List Product</button>
    </div>
</div>

<div class="shop-container" id="product-grid">
    <!-- Products from Firebase -->
</div>

<div class="checkout-bar" id="checkout-btn" onclick="checkout()">
    <span id="items-count">0 Items</span>
    <span style="font-weight: 800;">CONFIRM PURCHASE →</span>
</div>

<script>
    // --- DATABASE CONFIG ---
    const firebaseConfig = { 
        databaseURL: "https://centrol-bank-default-rtdb.asia-southeast1.firebasedatabase.app" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userId = "pranshi_main";

    let cart = [];
    let discount = 0;

    // --- PRODUCT MANAGEMENT ---
    function toggleAdmin() {
        const p = document.getElementById('admin-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function addProduct() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const cat = document.getElementById('p-cat').value || "General";
        const img = document.getElementById('p-img').value || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";

        if(name && price) {
            db.ref(`users/${userId}/shop_inventory`).push({ name, price: parseFloat(price), cat, img });
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            toggleAdmin();
        }
    }

    function loadProducts() {
        db.ref(`users/${userId}/shop_inventory`).on('value', (snap) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            snap.forEach(child => {
                const p = child.val();
                grid.innerHTML += `
                    <div class="product-card" data-name="${p.name.toLowerCase()}">
                        <button class="delete-p" onclick="deleteProduct('${child.key}')">×</button>
                        <img src="${p.img}" class="product-img">
                        <div class="product-info">
                            <div class="category">${p.cat}</div>
                            <div class="p-name">${p.name}</div>
                            <div class="p-price">₹${p.price.toLocaleString()}</div>
                            <button class="buy-btn" onclick="addToCart('${p.name}', ${p.price})">ADD TO CART</button>
                        </div>
                    </div>
                `;
            });
        });
    }

    function deleteProduct(id) {
        if(confirm("Remove item from marketplace?")) db.ref(`users/${userId}/shop_inventory/${id}`).remove();
    }

    function searchProducts() {
        const query = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.product-card').forEach(card => {
            card.style.display = card.dataset.name.includes(query) ? 'block' : 'none';
        });
    }

    // --- CART & COUPON (48HR LOGIC) ---
    function addToCart(name, price) {
        cart.push({name, price});
        const btn = document.getElementById('checkout-btn');
        btn.style.display = 'flex';
        document.getElementById('items-count').innerText = `${cart.length} ITEMS SELECTED`;
    }

    async function applyCoupon() {
        const snap = await db.ref(`users/${userId}/last_coupon`).once('value');
        const data = snap.val();
        const now = Date.now();
        const cycle = 48 * 60 * 60 * 1000;

        if(!data || (now - data.timestamp > cycle)) {
            const rand = Math.floor(Math.random() * 16) + 5;
            discount = rand;
            await db.ref(`users/${userId}/last_coupon`).set({ timestamp: now, percent: rand, status: "available" });
            document.getElementById('coupon-status').innerHTML = `<span class="coupon-active">🛒 SPECIAL: ${rand}% SHOP DISCOUNT ACTIVE</span>`;
        } else if(data.status === "used") {
            discount = 0;
            document.getElementById('coupon-status').innerText = "Next coupon in " + Math.round((cycle - (now - data.timestamp))/(1000*60*60)) + " hours";
        } else {
            discount = data.percent;
            document.getElementById('coupon-status').innerHTML = `<span class="coupon-active">🛒 UNUSED: ${discount}% OFF AVAILABLE</span>`;
        }
    }

    async function checkout() {
        let total = cart.reduce((s, i) => s + i.price, 0);
        if(discount > 0) total *= (1 - discount/100);

        const userRef = db.ref(`users/${userId}`);
        const balSnap = await userRef.child('balance').once('value');
        let currentBal = balSnap.val() || 0;

        if(currentBal >= total) {
            await userRef.child('balance').set(currentBal - total);
            if(discount > 0) await userRef.child('last_coupon/status').set("used");
            await userRef.child('history').push({
                amount: -total,
                description: `CEN SHOP: Purchased ${cart.length} items`,
                timestamp: new Date().toLocaleString(),
                type: "DEBIT"
            });
            alert("Payment Successful! Your assets are being prepared.");
            location.reload();
        } else {
            alert("Insufficient Bank Balance. Work more to buy this!");
        }
    }

    // Sync Balance
    db.ref(`users/${userId}/balance`).on('value', s => {
        document.getElementById('user-bal').innerText = `₹${(s.val() || 0).toLocaleString()}`;
    });

    loadProducts();
    applyCoupon();
</script>
</body>
</html>
